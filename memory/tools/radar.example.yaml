# polaris-radar: nach ~/.config/polaris/radar.yaml kopieren und anpassen.
# Die Namen installierter Omarchy-Plugins zaehlen automatisch als Stichworte.
days: 14                 # Zeitraum der Uebersicht
keywords:                # ganze Woerter, Gross-/Kleinschreibung egal
  - dictation
  - alt+tab
  - calendar
  - dock
  - backup
watch_issues: []         # z. B. owner/repo#12 (vorgemerkte Fehler)
watch_repos: []          # z. B. owner/repo (neueste Release, letzter Push)
own_repos: []            # eigene Repos: offene Issues/PRs anderer, neue mit Hinweis; owner/repo oder owner/*
security:                # Sicherheitsabgleich (Arch Security Tracker, kernel.org, CISA KEV)
  enabled: true
  days: 30               # aktiv ausgenutzte Luecken (KEV) dieses Zeitraums
  kernel_lag_warn: 4     # Warnung ab so vielen Stable-Releases Rueckstand
  kev_aliases:           # KEV-Produkt (klein) -> Paketname
    chromium v8: chromium
  acknowledged: []       # bewertete Befunde quittieren (nur mit Zustimmung des Nutzers), z. B.:
  # - id: kev:CVE-2026-123158          # wie in ~/.local/state/polaris/security.json
  #   subject: "openssh 10.6p1-2"      # installierter Stand aus security.json, in Anfuehrungszeichen; nach Update ungueltig
  #   until: 2026-12-09                # hoechstens 90 Tage voraus, danach neu bewerten
  #   reason: nur musl ohne PAM betroffen; hier glibc, sshd aus
